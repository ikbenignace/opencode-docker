services:
  opencode:
    build: .
    image: ghcr.io/ikbenignace/opencode-docker:latest
    container_name: opencode-web
    ports:
      - "4096:4096"
    volumes:
      # Projects directory - your working directory for code projects
      - ./data:/data
      # Configuration directory - stores providers, oh-my-opencode, and other settings
      - ./config:/root/.config/opencode
    environment:
      - OPENCODE_SERVER_PORT=4096
      - OPENCODE_SERVER_HOSTNAME=0.0.0.0
      # Optional: Uncomment to enable authentication
      # - OPENCODE_SERVER_USERNAME=opencode
      # - OPENCODE_SERVER_PASSWORD=your-secure-password-here
    restart: unless-stopped
